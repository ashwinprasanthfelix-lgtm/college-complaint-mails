<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('My Complaints')}"></head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="container wide">
  <div class="row-between">
    <h2>My Complaints</h2>
    <a class="btn" th:href="@{/student/complaints/new}">+ New Complaint</a>
  </div>
  <div class="alert success" th:if="${success}" th:text="${success}"></div>
  <div class="alert danger" th:if="${error}" th:text="${error}"></div>

  <div class="stats">
    <div class="stat"><span th:text="${total}">0</span>Total</div>
    <div class="stat"><span th:text="${counts['Pending']}">0</span>Pending</div>
    <div class="stat"><span th:text="${counts['In Progress']}">0</span>In Progress</div>
    <div class="stat"><span th:text="${counts['Resolved']}">0</span>Resolved</div>
  </div>

  <p class="muted" th:if="${#lists.isEmpty(complaints)}">You have not submitted any complaints yet.</p>
  <div class="table-wrap" th:unless="${#lists.isEmpty(complaints)}">
    <table>
      <thead>
        <tr><th>ID</th><th>Category</th><th>Description</th><th>Priority</th><th>Status</th><th>Submitted</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:each="c : ${complaints}">
          <td th:text="${c.complaintId}"></td>
          <td th:text="${c.category}"></td>
          <td th:text="${c.description}" class="desc"></td>
          <td><span class="badge" th:text="${c.priority}"
                    th:classappend="${c.priority == 'High'} ? 'p-high' : (${c.priority == 'Low'} ? 'p-low' : 'p-med')"></span></td>
          <td><span class="badge" th:text="${c.status}"
                    th:classappend="${c.status == 'Pending'} ? 'b-pending' : (${c.status == 'In Progress'} ? 'b-progress' : 'b-resolved')"></span></td>
          <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
          <td class="actions">
            <span th:if="${c.status == 'Pending'}">
              <a class="btn small" th:href="@{/student/complaints/{id}/edit(id=${c.complaintId})}">Edit</a>
              <form class="inline" method="post" th:action="@{/student/complaints/{id}/delete(id=${c.complaintId})}"
                    onsubmit="return confirm('Delete this complaint?');">
                <button class="small danger" type="submit">Delete</button>
              </form>
            </span>
            <span class="muted" th:unless="${c.status == 'Pending'}">Locked</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
