<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Profile')}"></head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="container">
  <h2>My Profile</h2>
  <form method="post" th:action="@{/student/profile}" th:object="${profile}">
    <label>USN (cannot be changed)</label>
    <input type="text" th:value="${usn}" disabled>

    <label>Full Name</label>
    <input type="text" th:field="*{fullName}">
    <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

    <label>Email</label>
    <input type="email" th:field="*{email}">
    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label>Department</label>
    <select th:field="*{department}">
      <option th:each="d : ${departments}" th:value="${d}" th:text="${d}"></option>
    </select>
    <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>

    <label>Contact Number</label>
    <input type="text" th:field="*{contactNo}">
    <div class="error" th:if="${#fields.hasErrors('contactNo')}" th:errors="*{contactNo}"></div>

    <button type="submit">Update Profile</button>
    <a class="btn secondary" th:href="@{/student/dashboard}">Cancel</a>
  </form>
</div>
</body></html>
