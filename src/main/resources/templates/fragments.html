<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Campus Complaints'">Campus Complaints</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="topbar" th:fragment="topbar">
  <strong>Campus Complaint Management System</strong>
  <span th:if="${navRole == 'student'}">
    <a th:href="@{/student/dashboard}">My Complaints</a>
    <a th:href="@{/student/profile}">Profile</a>
    <span class="who" th:text="${navName}"></span>
    <a th:href="@{/logout}">Logout</a>
  </span>
  <span th:if="${navRole == 'admin'}">
    <a th:href="@{/admin/dashboard}">Complaints</a>
    <a th:href="@{/admin/students}">Students</a>
    <span class="who" th:text="'Admin: ' + ${navName}"></span>
    <a th:href="@{/admin/logout}">Logout</a>
  </span>
</div>
</body>
</html>
