spring.application.name=campus-complaint-system
server.port=8080

# --- H2 database (no install needed). Data is saved in ./data/ so it survives restarts ---
spring.datasource.url=jdbc:h2:file:./data/complaintdb;MODE=Oracle;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Creates tables on startup (src/main/resources/schema.sql)
spring.sql.init.mode=always

# Browse the database at http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.thymeleaf.cache=false

# --- To switch to Oracle later, comment out the H2 lines above, set spring.sql.init.mode=never,
# --- run sql/schema.sql in Oracle, and use:
# spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
# spring.datasource.username=complaint_user
# spring.datasource.password=complaint_pass
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
